# ==============================================================================
# servers.conf — Lista de servidores para remote-audit.sh
# ==============================================================================
# Formato: NOMBRE|IP|ENTORNO|PEM_PATH (opcional)
#
# Entornos válidos: test, demo, prod, staging
# PEM_PATH: ruta absoluta al fichero .pem (opcional, si no se indica se usa contraseña)
#
# Ejemplos:
#   MISERVIDOR|10.0.0.1|prod                     → autenticación por contraseña
#   MISERVIDOR|10.0.0.1|prod|/home/user/key.pem  → autenticación por certificado PEM
#
# Añade o elimina líneas según necesites.
# Las líneas vacías y comentarios (#) se ignoran.
# ==============================================================================
